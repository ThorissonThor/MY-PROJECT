name: Weekly New Files Report

on:
  schedule:
    - cron: '0 10 * * 1-5'  # Every weekday at 10:00 AM UTC
    - cron: '0 14 * * 1-5'  # Every weekday at 2:00 PM UTC
  workflow_dispatch:      # Allow manual trigger from GitHub UI

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new files added in the past week
        id: new-files
        run: |
          NEW_FILES=$(git log --since="7 days ago" --diff-filter=A --name-only --pretty=format: | sort -u | grep -v '^$')
          if [ -z "$NEW_FILES" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
          else
            echo "has_files=true" >> $GITHUB_OUTPUT
            {
              echo 'files<<EOF'
              echo "$NEW_FILES"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub issue with report
        uses: actions/github-script@v7
        with:
          script: |
            const hasFiles = '${{ steps.new-files.outputs.has_files }}' === 'true';
            const today = new Date().toISOString().split('T')[0];

            let body;
            if (hasFiles) {
              const files = `${{ steps.new-files.outputs.files }}`;
              const fileList = files.trim().split('\n').map(f => `- \`${f}\``).join('\n');
              body = `## New Files Added in the Past Week\n\n${fileList}\n\n_Generated on ${today}_`;
            } else {
              body = `## Weekly New Files Report\n\nNo new files were added in the past week.\n\n_Generated on ${today}_`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly New Files Report — ${today}`,
              body: body
            });
