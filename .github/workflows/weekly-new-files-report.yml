name: Weekly New Files Report

on:
  schedule:
    - cron: '0 15 * * 1-5'  # Every weekday at 2:00 PM UTC
  workflow_dispatch:      # Allow manual trigger from GitHub UI

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new files added in the past week
        id: new-files
        run: |
          NEW_FILES=$(git log --since="24 hours ago" --diff-filter=A --name-only --pretty=format: | sort -u | grep -v '^$')
          if [ -z "$NEW_FILES" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "body=No new files were added since yesterday." >> $GITHUB_OUTPUT
          else
            echo "has_files=true" >> $GITHUB_OUTPUT
            FORMATTED=$(echo "$NEW_FILES" | sed 's/^/- /')
            {
              echo 'body<<EOF'
              echo "New files added since yesterday:"
              echo ""
              echo "$FORMATTED"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Send email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: throstur.thor@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "MY-PROJECT — New Files Report (${{ github.run_id }})"
          to: throstur.thor@gmail.com
          from: throstur.thor@gmail.com
          body: ${{ steps.new-files.outputs.body }}
